[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eight-ball-devtool"
version = "0.2.0"
description = "Native Python workbench for a layered eight-ball vision and planning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]
vision = ["numpy>=1.26", "opencv-python>=4.9", "Pillow>=10"]
yolo = ["numpy>=1.26", "opencv-python>=4.9", "Pillow>=10", "ultralytics>=8.3"]

[project.scripts]
eight-ball-devtool = "eight_ball_devtool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
